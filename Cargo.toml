[package]
name = "ig-prep"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
bytemuck = "1"
# By git rather than by path, so a clone builds for somebody who does not
# happen to have a sibling checkout. Swap in `path = "../exif-sooc"` locally
# when working on both at once.
exif-sooc = { git = "https://github.com/oddharsh/exif-sooc" }
fast_image_resize = "6"
# Site encoder release with a scoped SharpYUV float-input fix.
# Review output and licensing on upgrades; keep the source revision immutable.
zenjpeg = { git = "https://github.com/oddharsh/zenjpeg", rev = "d7ec0944d1ab6a3f4e2dc25bbc3a11461529cd63", version = "=0.8.4", features = ["trellis"] }
moxcms = { version = "0.8.1", features = ["extended_range"] }
png = "0.17"
tempfile = "3"
# Decode the lossless sips intermediate, including tiled 16-bit TIFF.
tiff = { version = "0.11.3", default-features = false }
# JSON-RPC needs a real JSON reader. Hand-rolling one to save a dependency
# means hand-rolling string escapes and unicode, which is exactly where a
# hand-rolled parser goes quietly wrong on a path containing a quote. Derive
# is deliberately off: the server works in `Value` and pulls no proc-macro.
serde_json = "1"
zune-jpeg = "0.4"

[dev-dependencies]
# Independent JPEG fixtures for decoder tests; not a production encoder.
jpeg-encoder = "0.6"
